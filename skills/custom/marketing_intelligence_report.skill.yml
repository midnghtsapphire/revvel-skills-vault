name: marketing_intelligence_report
title: Marketing Intelligence Report Generator
version: 1.1.0
description: >
  Generates daily structured Marketing Intelligence Reports for Tech and Politics trends by fetching
  live data from Google Trends RSS, Wikimedia Pageview API, and Hacker News Firebase API. Classifies
  items by category, scores signal strength via cross-source convergence analysis, and inserts the
  report into a MySQL database. Supports on-demand generation and fully automated daily scheduling
  via cron. Use for: OSINT platforms, marketing trend analysis, automated intelligence reporting,
  competitive intelligence, and daily briefing automation.
metadata:
  author: GlowStarLabs / midnghtsapphire
  category: Marketing & Intelligence
  tags:
    - marketing
    - intelligence
    - trends
    - osint
    - automation
    - reporting
    - google-trends
    - wikipedia
    - hacker-news
    - database
    - cron
    - growlingeyes
  source: revvel-custom
  created_at: "2026-04-03"
  updated_at: "2026-04-03"
  platform: GrowlingEyes OSINT Platform
  production_url: https://growlingeyes.com/marketing

dependencies:
  pip_packages:
    - requests
    - mysql-connector-python
    - beautifulsoup4
    - lxml

data_sources:
  google_trends:
    url: "https://trends.google.com/trending/rss?geo=US"
    format: XML
    notes: "Parse <title> and <ht:approx_traffic> tags. No auth required."
  wikipedia:
    url: "https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/{YYYY}/{MM}/{DD}"
    format: JSON
    notes: "CRITICAL: Always use yesterday's date — API publishes with 1-day lag."
  hacker_news:
    url: "https://hacker-news.firebaseio.com/v0/topstories.json"
    format: JSON
    notes: "Fetch top 30 IDs, then GET each item at /v0/item/{id}.json. No auth required."
  reddit:
    status: BLOCKED
    notes: "Reddit blocks server IPs. Use Hacker News instead."

