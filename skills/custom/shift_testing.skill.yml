name: shift_testing
title: S.H.I.F.T. — AI Agent Behavioral Testing Framework
version: 1.0.0
description: >
  The S.H.I.F.T. (Self-Healing Intent-Focused Tasks) framework for testing autonomous AI agents.
  Provides the Wizard of Oz prompt engineering method, the Self-Healing Evaluator scoring pattern,
  and the 5 Dimensions of Agent Quality. Use when building, testing, or debugging any AI agent.
